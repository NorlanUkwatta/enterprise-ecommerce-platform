server:
  port: ${CATALOG_SERVICE_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: catalog-service

  # Enable Java 21 Virtual Threads for non-blocking high-concurrency I/O (5M Customer Scale)
  threads:
    virtual:
      enabled: true

  # Isolated Database-per-Service (catalog_db) — Zero Hardcoded Secrets!
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${CATALOG_DB_NAME:catalog_db}?reWriteBatchedInserts=true
    username: ${CATALOG_DB_USER}
    password: ${CATALOG_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: catalog-service-hikari-pool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:15}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
      leak-detection-threshold: 5000
      auto-commit: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
