name: Enterprise CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # =========================================================================
  # STEPS 8-11: BUILD, UNIT/INTEGRATION TESTS, COVERAGE & SONARQUBE QUALITY
  # =========================================================================
  build-test-quality:
    name: Build, Test & Quality (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute Maven Build, Unit & Integration Tests with JaCoCo
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: SonarCloud Code Quality & Security Analysis
        if: ${{ vars.ENABLE_SONAR == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x mvnw
          ./mvnw -B sonar:sonar \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io

  # =========================================================================
  # STEPS 12-13 (A): SECRET DETECTION (GITLEAKS)
  # =========================================================================
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # STEPS 12-13 (B): DEPENDENCY VULNERABILITY SCAN (TRIVY SCA)
  # =========================================================================
  dependency-scan:
    name: Dependency Vulnerability Scan (Trivy SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Run Trivy Vulnerability Scanner on Maven Dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  # =========================================================================
  # STEPS 12-13 (C): SAST (STATIC APPLICATION SECURITY TESTING - CODEQL)
  # =========================================================================
  sast-codeql:
    name: SAST Analysis (GitHub CodeQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Check for Java Source Files
        id: check_java
        run: |
          if [ -n "$(find . -name '*.java' -print -quit)" ]; then
            echo "has_java=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_java=false" >> "$GITHUB_OUTPUT"
            echo "No Java source files yet; skipping CodeQL compilation until first module is added."
          fi

      - name: Set up JDK 21
        if: steps.check_java.outputs.has_java == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Initialize CodeQL for Java
        if: steps.check_java.outputs.has_java == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Build Java Modules for CodeQL
        if: steps.check_java.outputs.has_java == 'true'
        run: |
          chmod +x mvnw
          ./mvnw -B clean test-compile -DskipTests

      - name: Perform CodeQL SAST Analysis
        if: steps.check_java.outputs.has_java == 'true'
        uses: github/codeql-action/analyze@v3
